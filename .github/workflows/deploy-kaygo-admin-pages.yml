name: Deploy Kaygo Admin to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kaygo-admin-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORT: 4173
      BASE_PATH: /Kaygo/
      VITE_API_BASE_URL: ${{ vars.KAYGO_API_BASE_URL || secrets.KAYGO_API_BASE_URL }}
      VITE_WHATSAPP_URL: ${{ vars.KAYGO_WHATSAPP_URL || secrets.KAYGO_WHATSAPP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build admin app
        run: pnpm --filter @workspace/kaygo-admin run build

      - name: Add SPA fallback
        run: |
          cp artifacts/kaygo-admin/dist/public/index.html artifacts/kaygo-admin/dist/public/404.html
          for route in \
            admin \
            admin/utilisateurs \
            admin/trajets \
            admin/colis \
            admin/matching \
            admin/paiements \
            admin/litiges \
            admin/parametres \
            estimer \
            objets-autorises \
            faq \
            contact; do
            mkdir -p "artifacts/kaygo-admin/dist/public/$route"
            cp artifacts/kaygo-admin/dist/public/index.html "artifacts/kaygo-admin/dist/public/$route/index.html"
          done

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/kaygo-admin/dist/public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4

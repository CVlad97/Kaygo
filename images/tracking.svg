<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <rect width="500" height="350" rx="20" fill="#eff6ff"/>
  <!-- Phone mockup -->
  <rect x="150" y="30" width="200" height="290" rx="24" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="155" y="35" width="190" height="280" rx="20" fill="#fff"/>
  <!-- Status bar -->
  <rect x="155" y="35" width="190" height="28" rx="20" fill="#f8fafc"/>
  <text x="200" y="52" text-anchor="middle" fill="#64748b" font-size="8" font-family="sans-serif" font-weight="bold">10:30</text>
  <circle cx="315" cy="49" r="4" fill="#22c55e"/>
  <!-- Tracking header -->
  <rect x="165" y="68" width="170" height="24" rx="6" fill="#3b82f6"/>
  <text x="250" y="84" text-anchor="middle" fill="#fff" font-size="10" font-weight="bold" font-family="sans-serif">Suivi KG-5A8F3B2C</text>
  <!-- Tracking timeline -->
  <g transform="translate(30, 0)">
    <!-- Step 1: Collected -->
    <g transform="translate(175, 110)">
      <circle cx="0" cy="0" r="8" fill="#22c55e"/>
      <text x="0" y="3" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">✓</text>
      <text x="15" y="0" fill="#166534" font-size="10" font-weight="bold" font-family="sans-serif">Colis récupéré</text>
      <text x="15" y="14" fill="#64748b" font-size="8" font-family="sans-serif">Paris - 14 juil. 09:00</text>
    </g>
    <!-- Line between 1→2 -->
    <line x1="175" y1="118" x2="175" y2="148" stroke="#22c55e" stroke-width="2"/>
    <!-- Step 2: In transit -->
    <g transform="translate(175, 155)">
      <circle cx="0" cy="0" r="8" fill="#3b82f6"/>
      <text x="0" y="3" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">✈</text>
      <text x="15" y="0" fill="#1e40af" font-size="10" font-weight="bold" font-family="sans-serif">En transit</text>
      <text x="15" y="14" fill="#64748b" font-size="8" font-family="sans-serif">Vol AF820 - 15 juil. 14:00</text>
    </g>
    <!-- Line between 2→3 -->
    <line x1="175" y1="163" x2="175" y2="193" stroke="#93c5fd" stroke-width="2"/>
    <!-- Step 3: Arrived -->
    <g transform="translate(175, 200)">
      <circle cx="0" cy="0" r="8" fill="#94a3b8"/>
      <text x="0" y="3" text-anchor="middle" fill="#fff" font-size="8" font-weight="bold">📦</text>
      <text x="15" y="0" fill="#475569" font-size="10" font-weight="bold" font-family="sans-serif">Arrivé à destination</text>
      <text x="15" y="14" fill="#64748b" font-size="8" font-family="sans-serif">Fort-de-France - attendu 16 juil.</text>
    </g>
    <!-- Line between 3→4 -->
    <line x1="175" y1="208" x2="175" y2="238" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Step 4: Delivered -->
    <g transform="translate(175, 245)">
      <circle cx="0" cy="0" r="8" fill="#e2e8f0"/>
      <text x="0" y="3" text-anchor="middle" fill="#94a3b8" font-size="8" font-weight="bold">🏠</text>
      <text x="15" y="0" fill="#94a3b8" font-size="10" font-weight="bold" font-family="sans-serif">Livré</text>
      <text x="15" y="14" fill="#94a3b8" font-size="8" font-family="sans-serif">En attente...</text>
    </g>
  </g>
  <!-- Map area at top -->
  <g transform="translate(155, 35)">
    <rect x="0" y="28" width="190" height="40" rx="0" fill="#dbeafe"/>
    <path d="M10 46 Q30 38 50 42 Q70 46 90 38 Q110 30 130 36 Q150 42 170 34 L180 34 L180 68 L0 68Z" fill="#93c5fd" opacity="0.5"/>
    <circle cx="50" cy="46" r="4" fill="#22c55e"/>
    <circle cx="130" cy="42" r="4" fill="#3b82f6"/>
    <path d="M50 46 Q90 35 130 42" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
    <text x="95" y="62" text-anchor="middle" fill="#1e40af" font-size="6" font-family="sans-serif">Paris → Fort-de-France</text>
  </g>
</svg>
